<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="ambientOrb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientOrb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>

    <!-- Drop Shadows and Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.1); }
    }
    @keyframes floatChart {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .orb-anim1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 150px;
    }
    .orb-anim2 {
      animation: pulseOrb 10s ease-in-out infinite alternate;
      transform-origin: 950px 280px;
    }
    .chart-float {
      animation: floatChart 6s ease-in-out infinite;
    }
    .dash-line {
      stroke-dasharray: 6 6;
      animation: dashMove 4s linear infinite;
    }
    .dot-pulse1 { animation: blinkDot 2.5s infinite; }
    .dot-pulse2 { animation: blinkDot 3.2s infinite 0.8s; }
    .dot-pulse3 { animation: blinkDot 2.8s infinite 1.4s; }
  </style>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Cybernetic Grid Pattern -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Ambient Pulsing Glow Orbs in Background -->
  <circle class="orb-anim1" cx="240" cy="140" r="280" fill="url(#ambientOrb1)"/>
  <circle class="orb-anim2" cx="960" cy="270" r="260" fill="url(#ambientOrb2)"/>

  <!-- Decorative Animated Background Graph Lines & Nodes -->
  <g class="chart-float" opacity="0.35">
    <path class="dash-line" d="M 60 340 Q 250 290 400 320 T 750 250 T 1140 210" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 60 370 C 300 320 500 380 780 290 C 950 240 1050 270 1140 240" fill="none" stroke="#818cf8" stroke-width="2.5" opacity="0.6"/>
    
    <!-- Floating Tech Node Dots -->
    <circle cx="400" cy="320" r="4" fill="#38bdf8" class="dot-pulse1"/>
    <circle cx="750" cy="250" r="5" fill="#a855f7" class="dot-pulse2"/>
    <circle cx="950" cy="240" r="4.5" fill="#34d399" class="dot-pulse3"/>
  </g>

  <!-- Top Decorative Header Tag / Capsule -->
  <g transform="translate(60, 48)">
    <rect width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitles (High contrast, always clearly readable) -->
  <g transform="translate(60, 145)">
    <!-- Title Glow for Depth -->
    <text x="0" y="0" fill="url(#cyanPurpleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-0.5" filter="url(#glow)" opacity="0.5">Awesome Crypto Analytics &amp; Web3 Media</text>
    <!-- Crisp Foreground Title -->
    <text x="0" y="0" fill="url(#cyanPurpleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-0.5">Awesome Crypto Analytics &amp; Web3 Media</text>
    
    <!-- Subtitle -->
    <text x="0" y="46" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" opacity="0.95">
      The Definitive On-Chain Intelligence, DeFi Indexing &amp; Blockchain Telemetry Landscape
    </text>

    <!-- Description -->
    <text x="0" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Benchmarked SaaS Platforms • High-Performance Open-Source Indexers • Forensics &amp; Streaming Media
    </text>
  </g>

  <!-- Interactive Category Feature Pills -->
  <g transform="translate(60, 310)">
    <!-- Pill 1: On-Chain SQL -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="18" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⚡ On-Chain SQL</text>
    </g>

    <!-- Pill 2: DeFi TVL & Yields -->
    <g transform="translate(195, 0)">
      <rect width="190" height="38" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="18" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">📊 DeFi TVL &amp; Yields</text>
    </g>

    <!-- Pill 3: Wallet Entity Tracking -->
    <g transform="translate(400, 0)">
      <rect width="215" height="38" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="18" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🔍 Wallet Entity Tracking</text>
    </g>

    <!-- Pill 4: Self-Hosted Explorers -->
    <g transform="translate(630, 0)">
      <rect width="210" height="38" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="18" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🌐 Self-Hosted Explorers</text>
    </g>

    <!-- Pill 5: Web3 Broadcast Media -->
    <g transform="translate(855, 0)">
      <rect width="210" height="38" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="18" y="24" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">📡 Web3 Live Media</text>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>
</svg>
